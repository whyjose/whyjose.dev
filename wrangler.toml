# Cloudflare Worker config for the whyjose.dev chat proxy.
#
# This file is checked in on purpose: it is the deployable definition of the
# Worker, so `worker.js` is no longer something that only exists as a paste in
# the Cloudflare dashboard.
#
# Deploy locally:   npx wrangler deploy
# Deploy from CI:   .github/workflows/deploy-worker.yml (on push to main)
#
# SECRETS — never put these here. This file is public.
#   OPENROUTER_API_KEY must be set out of band, either with
#     npx wrangler secret put OPENROUTER_API_KEY
#   or via Cloudflare dashboard → Workers → Settings → Variables and Secrets.

name                = "whyjose-api"
main                = "worker.js"
compatibility_date  = "2025-08-01"
workers_dev         = false

# Non-secret runtime config only.
[vars]
# Comma-separated allowlist of browser origins permitted to call the chat
# endpoint. "*" disables the check and is intended for local dev only.
# Note: this restricts cross-origin use from browsers; it is not authentication.
ALLOWED_ORIGIN = "https://whyjose.dev,https://www.whyjose.dev"

# The Worker is served on a custom domain (api.whyjose.dev). The route below is
# commented out because the hostname is currently bound in the Cloudflare
# dashboard; uncomment to manage the binding from here instead, and make sure
# the zone is not also mapping it in the dashboard.
# [[routes]]
# pattern       = "api.whyjose.dev"
# custom_domain = true

[observability]
enabled = true
