<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — whyjose.dev</title>

  <meta name="description" content="This page does not exist on whyjose.dev." />
  <meta name="theme-color" content="#2060FD" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0.35'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%235E5CE6'/%3E%3Cstop%20offset='1'%20stop-color='%232060FD'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='url(%23g)'/%3E%3Ctext%20x='32'%20y='45'%20font-family='system-ui,Helvetica,Arial,sans-serif'%20font-size='36'%20font-weight='600'%20fill='%23FFFFFF'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #000000;
      --text:    #F5F5F7;
      --dim:     #6E6E73;
      --dimmer:  #3A3A3C;
      --accent:  #2060FD;
      --sys:     system-ui, 'Helvetica Neue', Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sys);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .stage {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 0;
    }

    /* ── Logo mark ── */
    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--dim);
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s ease forwards;
    }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 5px 14px 5px 10px;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.6s 0.4s ease forwards;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dimmer);
      flex-shrink: 0;
    }

    /* ── Main headline ── */
    .headline {
      font-size: clamp(32px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--text);
      max-width: 720px;
      margin-bottom: 24px;
      min-height: 2.2em;
    }

    /* ── Cursor ── */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 0.85em;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }

    /* ── Subtext ── */
    .sub {
      font-size: 17px;
      color: var(--dim);
      font-weight: 400;
      line-height: 1.5;
      max-width: 480px;
      opacity: 0;
      animation: fadeUp 0.6s 2.6s ease forwards;
      margin-bottom: 40px;
    }

    /* ── Action ── */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      opacity: 0;
      animation: fadeUp 0.6s 2.9s ease forwards;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .cta:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(32,96,253,0.08);
    }

    /* ── Fine print ── */
    .fine {
      font-size: 12px;
      color: var(--dimmer);
      opacity: 0;
      animation: fadeUp 0.6s 3.2s ease forwards;
      letter-spacing: 0.01em;
      margin-top: 28px;
    }

    .fine a {
      color: var(--accent);
      text-decoration: none;
    }

    .fine a:hover { text-decoration: underline; }

    /* ── Bottom wordmark ── */
    .wordmark {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--dimmer);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.6s 3.6s ease forwards;
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
<div class="stage">

  <div class="logo">JOSÉ.EXE</div>

  <div class="status-pill">
    <span class="status-dot"></span>
    404 — not found
  </div>

  <div class="headline" id="headline"><span class="cursor" id="cursor"></span></div>

  <p class="sub">This page doesn't exist.<br>Unlike me, who exists reluctantly.</p>

  <a class="cta" href="/">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to the chat
  </a>

  <p class="fine">Convinced this is my fault? <a href="mailto:hey@whyjose.dev">hey@whyjose.dev</a></p>

</div>

<div class="wordmark">whyjose.dev</div>

<script>
  const lines = [
    "Nothing\nhere."
  ];

  const headlineEl = document.getElementById('headline');
  const cursorEl   = document.getElementById('cursor');

  const CHAR_DELAY  = 38;
  const START_DELAY = 900;

  function type(text, el, cursor, delay) {
    return new Promise(resolve => {
      setTimeout(() => {
        let i = 0;
        // Move cursor inside headline before the text node
        el.innerHTML = '';
        el.appendChild(cursor);

        function next() {
          if (i < text.length) {
            const ch = text[i];
            if (ch === '\n') {
              el.insertBefore(document.createElement('br'), cursor);
            } else {
              el.insertBefore(document.createTextNode(ch), cursor);
            }
            i++;
            setTimeout(next, CHAR_DELAY + (Math.random() * 18 - 9));
          } else {
            resolve();
          }
        }
        next();
      }, delay);
    });
  }

  (async () => {
    for (const line of lines) {
      await type(line, headlineEl, cursorEl, START_DELAY);
    }
  })();
</script>
</body>
</html>
