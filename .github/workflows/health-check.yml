# Synthetic monitoring for the chat proxy.
#
# Hits GET https://api.whyjose.dev/health every 30 minutes. The endpoint is
# answered before the origin check and the rate limiter and never calls
# OpenRouter, so this costs nothing and cannot exhaust anyone's quota.
#
# There is no paging setup here on purpose: GitHub emails repo admins when a
# scheduled workflow fails, which is the right amount of alerting for a
# personal site. If this ever needs real alerting, the honest upgrade is an
# external prober (UptimeRobot, Better Stack) rather than more YAML.
#
# Note: GitHub disables scheduled workflows on repos with no activity for 60
# days, and cron runs on shared infrastructure can be delayed by many minutes.
# Treat this as a smoke test, not an SLA monitor.

name: Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  probe:
    name: GET /health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe api.whyjose.dev/health
        run: |
          echo "Probing https://api.whyjose.dev/health"
          # curl -f exits non-zero on any non-2xx status; the step's `bash -e`
          # then fails the job, which is what triggers the notification email.
          if ! body=$(curl -fsS --max-time 15 https://api.whyjose.dev/health); then
            echo "::error::Health endpoint unreachable or did not return 200."
            exit 1
          fi
          echo "Response: $body"
          case "$body" in
            *'"status":"ok"'*) echo "Healthy." ;;
            *) echo "::error::Unexpected health payload: $body"; exit 1 ;;
          esac
