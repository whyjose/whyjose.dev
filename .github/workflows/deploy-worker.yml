# Deploys the Cloudflare Worker whenever its source or config changes on main.
#
# REQUIRED SETUP (manual, one time — cannot be scripted from the repo):
#   1. Create a Cloudflare API token with the "Edit Cloudflare Workers"
#      template, scoped to the whyjose.dev account/zone.
#   2. Add it in GitHub → Settings → Secrets and variables → Actions → New
#      repository secret, named exactly CLOUDFLARE_API_TOKEN.
#   3. Add CLOUDFLARE_ACCOUNT_ID the same way (it is not a secret in the strict
#      sense, but keeping it out of the repo avoids noise).
#
# Until those exist this workflow will fail on the deploy step. That is
# expected; the site itself is unaffected because GitHub Pages deploys
# separately from the repo root.
#
# OPENROUTER_API_KEY is NOT set here. It is a Worker secret managed with
# `wrangler secret put OPENROUTER_API_KEY` and survives redeploys.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check worker.js
        run: node --check worker.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify /health responds
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://api.whyjose.dev/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Worker deployed but /health did not return 200."
          exit 1
